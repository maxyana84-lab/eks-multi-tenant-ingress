apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alpha-ingress
  namespace: tenant-alpha
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: saas-shared
    alb.ingress.kubernetes.io/group.order: "10"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:eu-north-1:292960608922:certificate/6f662b2f-a66f-4810-9274-e336de33154a"
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/wafv2-acl-arn: "arn:aws:wafv2:eu-north-1:292960608922:regional/webacl/saas-lab-waf/f6fe119a-4917-483b-84dd-fe1cba877fac"
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "10"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "2"
    alb.ingress.kubernetes.io/load-balancer-attributes: access_logs.s3.enabled=true,access_logs.s3.bucket=saas-lab-alb-logs-292960608922,access_logs.s3.prefix=alb-logs
spec:
  ingressClassName: alb
  rules:
    - host: alpha.saas.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: alpha-api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: alpha-frontend
                port:
                  number: 80
