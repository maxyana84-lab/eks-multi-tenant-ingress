apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: tenant-gamma
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
      tenant: gamma
  template:
    metadata:
      labels:
        app: frontend
        tenant: gamma
    spec:
      containers:
        - name: frontend
          image: hashicorp/http-echo
          args:
            - "-text=gamma-frontend-response"
            - "-listen=:8080"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gamma-frontend
  namespace: tenant-gamma
spec:
  selector:
    app: frontend
    tenant: gamma
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: tenant-gamma
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
      tenant: gamma
  template:
    metadata:
      labels:
        app: api
        tenant: gamma
    spec:
      containers:
        - name: api
          image: hashicorp/http-echo
          args:
            - "-text=gamma-api-response"
            - "-listen=:8080"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gamma-api
  namespace: tenant-gamma
spec:
  selector:
    app: api
    tenant: gamma
  ports:
    - port: 80
      targetPort: 8080
